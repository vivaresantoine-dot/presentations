<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">Du contenu à la présentation</title>
  <desc id="desc">Trois étapes : écrire, personnaliser, présenter.</desc>
  <path d="M150 85H750" stroke="#ccd9df" stroke-width="6"/>
  <g fill="#176b70"><circle cx="150" cy="85" r="42"/><circle cx="450" cy="85" r="42"/><circle cx="750" cy="85" r="42"/></g>
  <g fill="white" font-family="Arial, sans-serif" font-size="30" text-anchor="middle"><text x="150" y="96">1</text><text x="450" y="96">2</text><text x="750" y="96">3</text></g>
  <g fill="#203047" font-family="Arial, sans-serif" font-size="25" text-anchor="middle"><text x="150" y="175">Écrire</text><text x="450" y="175">Personnaliser</text><text x="750" y="175">Présenter</text></g>
</svg>
